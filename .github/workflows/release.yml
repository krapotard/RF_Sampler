name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Le tag doit correspondre à la version du manifest
        run: |
          V=$(node -p "require('./extension/manifest.json').version")
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version du manifest (v$V)"
            exit 1
          fi
      - name: Installer ffmpeg (fichiers de test)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Vérifications
        run: |
          node scripts/check-manifest.js
          node --test tests/audiocut.test.js
      - name: Créer les zips Chrome et Firefox (manifest.json à la racine, avec les textes de licence)
        run: |
          node scripts/build-firefox.js
          mkdir -p dist/chrome
          cp -r extension/. dist/chrome/
          for d in dist/chrome dist/firefox; do
            cp LICENSE THIRD_PARTY_NOTICES.md "$d/"
            cp -r third_party "$d/third_party"
          done
          (cd dist/chrome && zip -r "../../rf-sampler-$GITHUB_REF_NAME.zip" . -x ".DS_Store")
          (cd dist/firefox && zip -r "../../rf-sampler-firefox-$GITHUB_REF_NAME.zip" . -x ".DS_Store")
      - name: Publier la release (ou ajouter les zips à la release déjà créée depuis le site)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=("rf-sampler-$GITHUB_REF_NAME.zip" "rf-sampler-firefox-$GITHUB_REF_NAME.zip")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" --title "$GITHUB_REF_NAME" --generate-notes
          fi
