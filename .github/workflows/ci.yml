name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer ffmpeg (fichiers de test)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Vérifier le manifest
        run: node scripts/check-manifest.js
      - name: Syntaxe JavaScript
        run: for f in extension/*.js scripts/*.js tests/*.js; do node --check "$f"; done
      - name: Tests
        run: node --test tests/audiocut.test.js
